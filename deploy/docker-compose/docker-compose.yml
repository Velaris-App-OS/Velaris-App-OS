# Auto-generated by Velaris setup wizard
# Only includes services you selected
services:
  # ── Temporal (always required) ──
  temporal-db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: temporal
      # Default "temporal" kept as fallback so existing setups still boot, but
      # set VELARIS_TEMPORAL_DB_PASSWORD in your .env — weak default creds plus
      # an exposed port were the 2026-06-19 cryptojacker entry vector.
      POSTGRES_PASSWORD: ${VELARIS_TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    # NO published port: only the `temporal` container connects to this DB, over
    # the internal compose network (POSTGRES_SEEDS=temporal-db). Never expose a
    # database to the host or network unless something off-Docker must reach it.
    volumes: [temporal-db:/var/lib/postgresql/data]
    # Every long-running service here carries `restart: unless-stopped`. On
    # 2026-08-05 only the five that already had it survived a Docker daemon
    # restart; the DB, cache, broker and vault stayed Exited(255) while the
    # case-service systemd unit came back and served 500s against a dead
    # Postgres. "unless-stopped" (not "always") is deliberate: a container you
    # stopped on purpose — or that stop-velaris.sh brought down — stays down.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-db: { condition: service_healthy }
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${VELARIS_TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-db
    # Loopback-only: the host case-service reaches Temporal at 127.0.0.1:7233.
    # Not reachable from the network.
    ports: ["127.0.0.1:7233:7233"]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    # Loopback-only admin UI. Reach it via SSH tunnel, not over the network.
    ports: ["127.0.0.1:8233:8080"]
    restart: unless-stopped

  velaris-db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: velaris
      POSTGRES_PASSWORD: ${VELARIS_DB_PASSWORD:?not set - run scripts/secrets-render.sh or pass --env-file ~/helix/.env}
      POSTGRES_DB: velaris
    # Loopback-only: the host case-service connects at 127.0.0.1:5432. This is
    # your application database — it must NEVER be reachable from the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [velaris-db:/var/lib/postgresql/data]
    # Docker's default /dev/shm is 64 MB. PostgreSQL's parallel queries take
    # their shared memory there, and under load (R6 soak 2026-11-05, ~400k
    # cases) they ran out: "could not resize shared memory segment … No space
    # left on device" — 4,835 analytics and case-list 500s in 7 h.
    shm_size: 256mb
    # THE one that took the platform down on 2026-08-05. Without this, a Docker
    # daemon restart leaves the application database Exited(255) and every login
    # returns 500.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velaris"]
      interval: 5s
      retries: 10

  replication-gw:
    # R5c step 11 — the standby's way to both databases (replication-gw/nginx.conf).
    # Profile `standby`: runs ONLY while a standby is linked (.standby/main.json,
    # compose-profiles.sh). `standby-velaris.sh link` starts it, `unlink` removes
    # it; setup and update never do. Loopback only — the standby arrives over SSH.
    image: nginx:1.27.5-alpine
    profiles: ["standby"]
    container_name: velaris-replication-gw
    # The operator sets VELARIS_REPLICATION_PORT / _TEMPORAL_PORT; these two are
    # those values once checked (compose-profiles.sh, velaris_standby.py). A
    # mistyped port written here made EVERY compose command fail — this
    # service is parsed even when its profile is off — so nothing could start (R1).
    ports:
      - "127.0.0.1:${VELARIS_REPLICATION_GW_PORT:-5442}:5442"
      - "127.0.0.1:${VELARIS_REPLICATION_GW_TEMPORAL_PORT:-5443}:5443"
    volumes:
      - ./replication-gw/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  velaris-pooler:
    # R5d 6a — PgBouncer in front of velaris-db (PostgreSQL only). Profile
    # `pooler`: runs ONLY when VELARIS_CASE_DATABASE_POOLER_URL is set and the
    # database is the bundled one (compose-profiles.sh). setup-velaris.sh turns
    # it on for a NEW PostgreSQL install; update-velaris.sh never does. Empty
    # setting = no container and the platform connects directly, as before.
    # Migrations, backups and admin scripts always use :5432, never this.
    #
    # Apache-2.0 image, maintained by CloudNativePG. >= 1.21 is required:
    # asyncpg uses named prepared statements, which transaction pooling only
    # carries with max_prepared_statements on.
    image: ghcr.io/cloudnative-pg/pgbouncer:1.25.2
    profiles: [pooler]
    depends_on:
      velaris-db: { condition: service_healthy }
    # The config is written inside the container at start, from the same
    # password velaris-db gets: no credential file on the host. `:-` not `:?`
    # for the same reason as the event broker — compose interpolates the whole
    # file for every install, pooled or not.
    #
    # The UNIX socket (VELARIS_CASE_DATABASE_POOLER_SOCKET=true): the platform
    # connects through ./pooler-socket instead of 127.0.0.1:6432 — a loopback
    # port is free while this container restarts, and a local user who bound it
    # then could pose as PostgreSQL and be sent the password in clear. The
    # container starts as root only to choose who it runs as: setting on — the
    # folder is made 0700 and PgBouncer runs as the folder's owner (the install
    # owner; never root), so only that owner can reach the socket; setting off —
    # PgBouncer runs as `pgbouncer` with its socket in /tmp, exactly as before.
    user: "0"
    volumes:
      - ./pooler-socket:/run/velaris-sock
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${VELARIS_DB_PASSWORD:-}" ]; then
          echo "velaris-pooler: VELARIS_DB_PASSWORD is empty - refusing to start." >&2; exit 1
        fi
        # As root (first pass): choose the user, then run this same script again
        # as that user ($$BASH_EXECUTION_STRING) — never PgBouncer as root.
        if [ "$$(id -u)" = 0 ]; then
          case "$$(printf "%s" "$${VELARIS_POOLER_SOCKET:-}" | tr "[:upper:]" "[:lower:]")" in
            1|true|yes|on)
              run_uid="$$(stat -c %u /run/velaris-sock)"; run_gid="$$(stat -c %g /run/velaris-sock)"
              if [ "$$run_uid" = 0 ]; then
                echo "velaris-pooler: deploy/docker-compose/pooler-socket is owned by root - it must belong to the install owner. Refusing to start." >&2; exit 1
              fi
              chmod 0700 /run/velaris-sock
              rm -f /run/velaris-sock/.s.PGSQL.6432 /run/velaris-sock/.s.PGSQL.6432.lock
              export POOLER_SOCK_DIR=/run/velaris-sock ;;
            *) run_uid="$$(id -u pgbouncer)"; run_gid="$$(id -g pgbouncer)"
               export POOLER_SOCK_DIR=/tmp ;;
          esac
          export POOLER_CFG="$$(mktemp -d)"
          chown "$$run_uid:$$run_gid" "$$POOLER_CFG"
          exec setpriv --reuid="$$run_uid" --regid="$$run_gid" --clear-groups --inh-caps=-all \
            /bin/bash -c "$$BASH_EXECUTION_STRING"
        fi
        umask 077
        # The userlist holds the server's own SCRAM verifier, read from
        # velaris-db (velaris owns the bundled database). With a plain password
        # there instead, PgBouncer derives SCRAM keys with its own salt and
        # reuses them for server logins, so under concurrent logins some fail
        # "password authentication failed" (seen 2026-10-18). If the verifier
        # cannot be read (a role without that right), md5 is used between the
        # platform and the pooler, which never reuses keys.
        #
        # `velaris_commerce` (R5e step 7), `velaris_portal` (step 8) and
        # `velaris_user` (step 10) are the same database and role with their own
        # server connections — PgBouncer pools per database name — so a commerce,
        # portal or sign-in transaction waiting on case-service never holds one of
        # case-service's. Used only when
        # VELARIS_CASE_COMMERCE_/PORTAL_/USER_DATABASE_POOLER_URL names it; unused,
        # it opens nothing.
        secret="$$(PGPASSWORD="$$VELARIS_DB_PASSWORD" psql -h velaris-db -U velaris -d velaris -tAXc "SELECT rolpassword FROM pg_authid WHERE rolname = 'velaris'" 2>/dev/null || true)"
        case "$$secret" in
          SCRAM-SHA-256\$$*) entry="$$secret"; auth=scram-sha-256 ;;
          *) entry="$$VELARIS_DB_PASSWORD"; auth=md5
             echo "velaris-pooler: SCRAM verifier not readable - using md5 between the platform and the pooler." >&2 ;;
        esac
        printf '"velaris" "%s"\n' "$$(printf '%s' "$$entry" | sed 's/"/""/g')" > "$$POOLER_CFG/userlist.txt"
        # R1: a mistyped size is the default, with a line — not a pooler that
        # will not start, which takes every database connection with it.
        num() { case "$$1" in ''|*[!0-9]*|0*|??????*) [ -n "$$1" ] && echo "velaris-pooler: $$3='$$1' is not a whole number - using $$2" >&2; echo "$$2" ;; *) echo "$$1" ;; esac; }
        VELARIS_POOLER_POOL_SIZE="$$(num "$${VELARIS_POOLER_POOL_SIZE:-}" 20 VELARIS_CASE_POOLER_POOL_SIZE)"
        VELARIS_POOLER_MAX_CLIENT_CONN="$$(num "$${VELARIS_POOLER_MAX_CLIENT_CONN:-}" 1000 VELARIS_CASE_POOLER_MAX_CLIENT_CONN)"
        VELARIS_POOLER_COMMERCE_POOL_SIZE="$$(num "$${VELARIS_POOLER_COMMERCE_POOL_SIZE:-}" 10 VELARIS_CASE_POOLER_COMMERCE_POOL_SIZE)"
        VELARIS_POOLER_PORTAL_POOL_SIZE="$$(num "$${VELARIS_POOLER_PORTAL_POOL_SIZE:-}" 10 VELARIS_CASE_POOLER_PORTAL_POOL_SIZE)"
        VELARIS_POOLER_USER_POOL_SIZE="$$(num "$${VELARIS_POOLER_USER_POOL_SIZE:-}" 10 VELARIS_CASE_POOLER_USER_POOL_SIZE)"
        cat > "$$POOLER_CFG/pgbouncer.ini" <<INI
        [databases]
        velaris = host=velaris-db port=5432 dbname=velaris
        velaris_commerce = host=velaris-db port=5432 dbname=velaris pool_size=$${VELARIS_POOLER_COMMERCE_POOL_SIZE:-10}
        velaris_portal = host=velaris-db port=5432 dbname=velaris pool_size=$${VELARIS_POOLER_PORTAL_POOL_SIZE:-10}
        velaris_user = host=velaris-db port=5432 dbname=velaris pool_size=$${VELARIS_POOLER_USER_POOL_SIZE:-10}
        [pgbouncer]
        listen_addr = 0.0.0.0
        listen_port = 6432
        unix_socket_dir = $$POOLER_SOCK_DIR
        auth_type = $$auth
        auth_file = $$POOLER_CFG/userlist.txt
        pool_mode = transaction
        max_prepared_statements = 200
        default_pool_size = $${VELARIS_POOLER_POOL_SIZE:-20}
        max_client_conn = $${VELARIS_POOLER_MAX_CLIENT_CONN:-1000}
        ignore_startup_parameters = extra_float_digits
        INI
        exec /usr/bin/pgbouncer "$$POOLER_CFG/pgbouncer.ini"
    environment:
      VELARIS_DB_PASSWORD: ${VELARIS_DB_PASSWORD:-}
      VELARIS_POOLER_SOCKET: ${VELARIS_CASE_DATABASE_POOLER_SOCKET:-}
      VELARIS_POOLER_POOL_SIZE: ${VELARIS_CASE_POOLER_POOL_SIZE:-20}
      VELARIS_POOLER_MAX_CLIENT_CONN: ${VELARIS_CASE_POOLER_MAX_CLIENT_CONN:-1000}
      VELARIS_POOLER_COMMERCE_POOL_SIZE: ${VELARIS_CASE_POOLER_COMMERCE_POOL_SIZE:-10}
      VELARIS_POOLER_PORTAL_POOL_SIZE: ${VELARIS_CASE_POOLER_PORTAL_POOL_SIZE:-10}
      VELARIS_POOLER_USER_POOL_SIZE: ${VELARIS_CASE_POOLER_USER_POOL_SIZE:-10}
    # PgBouncer needs about one descriptor per client plus one per server
    # connection; Docker's default soft limit (1024) is below max_client_conn.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # Loopback-only, like the database it fronts.
    ports: ["127.0.0.1:6432:6432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U velaris -d velaris"]
      interval: 5s
      retries: 10

  cache:
    # Valkey = Linux Foundation fork of Redis, BSD-3 (Redis 7.4+ moved to
    # SSPL). Protocol-compatible drop-in: same port, same client library.
    # Architecture Report §11 mandates this swap.
    image: valkey/valkey:8.1.10-alpine
    # Password: VELARIS_CASE_REDIS_PASSWORD. setup-velaris.sh generates one for a
    # NEW install (and turns the cache on); start-velaris.sh generates one when an
    # operator turns VELARIS_CASE_REDIS_ENABLED on without it. Unset = no AUTH,
    # exactly as before — an existing install is not changed by an update.
    # The same value reaches LiveKit and its egress below.
    command:
      - /bin/sh
      - -c
      - >-
        if [ -n "$$VELARIS_CACHE_PASSWORD" ]; then
        exec valkey-server --requirepass "$$VELARIS_CACHE_PASSWORD";
        else exec valkey-server; fi
    environment:
      VELARIS_CACHE_PASSWORD: ${VELARIS_CASE_REDIS_PASSWORD:-}
      # valkey-cli (the healthcheck) reads its password from here.
      REDISCLI_AUTH: ${VELARIS_CASE_REDIS_PASSWORD:-}
    # Loopback-only: host case-service reaches the cache at 127.0.0.1:6379.
    ports: ["127.0.0.1:6379:6379"]
    volumes: [cache-data:/data]
    restart: unless-stopped
    healthcheck:
      # An EMPTY REDISCLI_AUTH would still send AUTH "" — unset it when empty.
      test: ["CMD-SHELL", "[ -n \"$$REDISCLI_AUTH\" ] || unset REDISCLI_AUTH; valkey-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10

  events:
    # The event broker for the CDC event bus (integrations/event_bus.py).
    # Apache Kafka, single node, KRaft (no ZooKeeper). Replaced Redpanda in the
    # November 2026 release: Redpanda v26.2 would not start without a paid
    # licence (Nov_TODO R5e).
    #
    # Profile `events`: runs ONLY when VELARIS_CASE_EVENT_BUS_ENABLED is on
    # (compose-profiles.sh). The bus is off by default, so most installs run no
    # broker at all.
    image: apache/kafka:4.3.1
    profiles: [events]
    # Refuse to start an UNAUTHENTICATED broker. compose cannot use `:?` here —
    # it interpolates the whole file, so a required variable would stop every
    # install, including those with the bus off — so the check runs in the
    # container, where only an install that turned the bus on reaches it.
    # (VELARIS_EVENT_BUS_PASSWORD, not KAFKA_*: the image turns every KAFKA_*
    # variable into a broker property.)
    command:
      - /bin/bash
      - -c
      - >-
        if [ -z "$$VELARIS_EVENT_BUS_PASSWORD" ]; then
        echo "events: VELARIS_CASE_EVENT_BUS_PASSWORD is empty - refusing to start an unauthenticated broker." >&2;
        echo "events: start-velaris.sh / update-velaris.sh generate it when the event bus is on." >&2;
        exit 1; fi;
        exec /etc/kafka/docker/run
    environment:
      VELARIS_EVENT_BUS_PASSWORD: ${VELARIS_CASE_EVENT_BUS_PASSWORD:-}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: velaris-events-kraft-01
      # Three listeners, and only one of them reachable from outside the
      # container:
      #   CLIENT     0.0.0.0:19092  SASL/PLAIN — published on host loopback only;
      #                             this is what case-service (on the host) uses
      #   BROKER     localhost:9094 the broker talking to itself (single node)
      #   CONTROLLER localhost:9093 KRaft — nothing outside may reach it
      # There is no unauthenticated listener on the compose network: a container
      # that needs the stream connects to events:19092 with the password.
      KAFKA_LISTENERS: CLIENT://0.0.0.0:19092,BROKER://localhost:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://127.0.0.1:19092,BROKER://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:SASL_PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS: PLAIN
      # One user. The password is hex (setup generates it); an operator-chosen
      # one must not contain a double quote.
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_${VELARIS_CASE_EVENT_BUS_USERNAME:-velaris}="${VELARIS_CASE_EVENT_BUS_PASSWORD:-}";
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One node: every internal topic has exactly one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The publisher creates its topics itself; nothing is created by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Small single-box footprint (Redpanda ran at 512M).
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    # Only the client listener is published, and only on host loopback.
    ports: ["127.0.0.1:19092:19092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    restart: unless-stopped


  # search (OpenSearch) removed 2026-06-12 — zero references in platform
  # code; it never served a request. Re-add deliberately if a search
  # feature ships, don't resurrect from habit.

  # auth (Keycloak) removed 2026-06-12 — login is the built-in stack
  # (/api/v1/auth/login: bcrypt + RS256 + passkeys; auth_mode="jwt").
  # The OIDC code path (auth_mode="oidc" + oidc_discovery_url) stays in the
  # platform; re-add an IdP container deliberately when a customer needs
  # bring-your-own-IdP, not from habit.

  ollama:
    image: ollama/ollama:0.40.5
    # Loopback-only: host case-service reaches the model server at 127.0.0.1:11434.
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
      - ../../models:/models:ro
    entrypoint: ["/bin/bash", "/models/.ollama-init.sh"]
    restart: unless-stopped


  # ── HxMeet P2 — embedded driver (self-hosted LiveKit SFU, Apache-2.0) ──
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: velaris-livekit
    # Host networking on purpose (same pattern as the gateway):
    #  (a) WebRTC media needs UDP ports on the host interface, and host-mode
    #      ports stay under UFW — bridge-published ports bypass it (the
    #      2026-06-19 incident class);
    #  (b) webhooks must reach the loopback-only API gateway (127.0.0.1:8200).
    # Signalling binds all interfaces so browsers on OTHER devices can join;
    # UFW gates exposure (allow 7880-7881/tcp + 50700-50720/udp from LAN only).
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          port_range_start: 50700
          port_range_end: 50720
          use_external_ip: false
        # P3: egress dispatch runs over the existing Valkey (loopback-published).
        redis:
          address: 127.0.0.1:6379
          password: "${VELARIS_CASE_REDIS_PASSWORD:-}"
        # Defaults exist only so a fresh install can `compose up openbao`
        # before the first secrets-render (compose interpolates the whole
        # file). They bind loopback-only, and case-service without the
        # rendered VELARIS_CASE_LIVEKIT_* vars keeps the embedded driver
        # fail-closed (501) — mismatched keys can't mint a joinable token.
        keys:
          ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}: ${VELARIS_CASE_LIVEKIT_API_SECRET:-devsecret_replace_me_00000000000000}
        webhook:
          api_key: ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}
          urls:
            - http://127.0.0.1:8200/api/v1/meet/webhook/livekit
    restart: unless-stopped

  # ── HxMeet P3 — recording egress worker (separate Apache-2.0 service) ──
  # Renders the room in headless Chrome and writes the MP4 to /out — the
  # shared dir case-service ingests from (sha256 > tenant-DEK seal > case
  # document > audit chain, then the file is deleted). Host networking for
  # the same reasons as livekit; SYS_ADMIN is required by Chrome's sandbox.
  livekit-egress:
    image: livekit/egress:v1.13.0
    container_name: velaris-livekit-egress
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: 127.0.0.1:6379
          password: "${VELARIS_CASE_REDIS_PASSWORD:-}"
        api_key: ${VELARIS_CASE_LIVEKIT_API_KEY:-devkey}
        api_secret: ${VELARIS_CASE_LIVEKIT_API_SECRET:-devsecret_replace_me_00000000000000}
        ws_url: ws://127.0.0.1:7880
        insecure: true
    volumes:
      - ${VELARIS_CASE_MEET_RECORDINGS_DIR:-/tmp/velaris-recordings}:/out
    restart: unless-stopped

# The API services run on the HOST in this deployment (start-velaris.sh or the
# systemd units), which is why these are commented out. Kept, and kept current,
# so the container path stays a change of two lines rather than a rediscovery.
#
# Note the build context: since 13b every service depends on `velaris-shared`
# (services/_shared), a path dependency that a context rooted at the service
# directory cannot see. The context is the REPOSITORY ROOT for all four.
#
#  case-service:
#    build:
#      context: ../..
#      dockerfile: services/case-service/Dockerfile
#    ports: ["8201:8200"]
#    depends_on:
#      velaris-db: { condition: service_healthy }
#      temporal: { condition: service_started }
#    environment:
#      VELARIS_CASE_DATABASE_URL: postgresql+asyncpg://velaris:velaris_dev_password@velaris-db:5432/velaris
#      VELARIS_CASE_TEMPORAL_HOST: temporal:7233
#      VELARIS_CASE_SERVICE_PORT: "8200"
