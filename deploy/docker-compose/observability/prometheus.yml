global:
  scrape_interval: 15s
  evaluation_interval: 15s
# Default alert set (R7) — what each rule means and what to do: docs/monitoring.md.
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  # Prometheus runs on the host network (docker-compose.yml): the gateway and
  # the engine listen on loopback only.
  - job_name: helix-case-service
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8200']
        labels: { service: case-service }
# The engine serves no /metrics; its health shows as Temporal and the
# platform's own lines (velaris_dependency_degraded).
