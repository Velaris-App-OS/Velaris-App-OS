# Velaris standby (R5c, Nov_TODO step 11) — the replication gateway.
#
# Runs ONLY on a main server that has a standby linked (compose profile
# `standby`, switched on by .standby/main.json — compose-profiles.sh). It lets
# the standby's streaming replication reach BOTH databases without either
# database container being recreated: temporal-db publishes no port at all,
# and velaris-db only 127.0.0.1:5432, which this does not change.
#
# Its ports are published on 127.0.0.1 only. Nothing here is reachable from the
# network: the standby arrives through an SSH tunnel whose key may forward to
# these two ports and nothing else (authorized_keys `permitopen`). Docker
# bypasses UFW (2026-06-19), so a network-published port would have been open
# whatever the firewall said.
#
# Plain TCP passthrough. Each database authenticates the standby itself
# (role velaris_replicator, SCRAM, `samenet` in pg_hba, replication only).
#
# Names are resolved per connection, not once at start: an update recreates
# velaris-db with a new address, and a cached one would silently break
# replication until this container was restarted.
worker_processes 1;
events { worker_connections 64; }
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 5442;
        set $velaris_db velaris-db:5432;
        proxy_pass $velaris_db;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
    }

    server {
        listen 5443;
        set $temporal_db temporal-db:5432;
        proxy_pass $temporal_db;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
    }
}
