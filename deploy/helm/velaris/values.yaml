# ── Velaris Helm chart values ─────────────────────────────────────────

# ── Pod hardening ────────────────────────────────────────────────────
# Applied to every Velaris workload (the bundled PostgreSQL and Valkey subcharts
# already carry their own). The images run as an unprivileged user; this states
# it where the cluster enforces it, and meets the `restricted` Pod Security
# Standard.
podSecurity:
  runAsNonRoot: true
  # Left empty so the image's own USER decides (case-service `helix`, the others
  # `velaris`). Set both only if you know the uid your image runs as — a wrong
  # uid means a pod that cannot read its own files.
  runAsUser: ""
  # The images' group (uid/gid 10001). This is what makes a MOUNTED VOLUME
  # writable by a non-root pod: most storage classes present a fresh volume as
  # root:root 0755, and without `fsGroup` the document PVC below is mounted and
  # unwritable — kind's local-path provisioner hands out 0777 and hides it, a
  # real cluster does not. Set to "" only if your images run as another gid.
  fsGroup: 10001
  seccompProfile: RuntimeDefault
  # OFF by default, deliberately: with local document storage case-service writes
  # uploads to the container filesystem, and a read-only root turns that into a
  # 500 on upload. Turn it on when documents go to S3/MinIO.
  readOnlyRootFilesystem: false

# ── The database URL lives in a Secret ───────────────────────────────
# `existingSecret` points at one you manage (external secret manager, sealed
# secret); the chart then creates none. `key` is the entry inside it.
databaseSecret:
  existingSecret: ""
  key: database-url
  # With pooler.enabled and an existingSecret, that Secret must also hold these
  # two keys: the URL through the pooler, and the database password the pooler
  # logs in with.
  poolerKey: pooler-url
  poolerPasswordKey: pooler-db-password
  # Optional: commerce-service's own pool. Missing from an existingSecret =
  # commerce shares pooler-url.
  poolerCommerceKey: pooler-commerce-url
  poolerPortalKey: pooler-portal-url      # likewise, portal-service's own pool
  poolerUserKey: pooler-user-url          # likewise, user-service's own pool
  # R5d 11b: with readReplica.fromExistingSecret, the read replica's URL in that Secret.
  readKey: read-url

image:
  caseService:
    repository: helix/case-service
    tag: latest
    pullPolicy: IfNotPresent
  engine:
    repository: helix/engine
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: helix/case-service  # Same image, different entrypoint
    tag: latest
    pullPolicy: IfNotPresent
  # Extracted from case-service at roadmap 13c-e — one image each.
  analyticsService:
    repository: helix/analytics-service
    tag: latest
    pullPolicy: IfNotPresent
  hxgraphService:
    repository: helix/hxgraph-service
    tag: latest
    pullPolicy: IfNotPresent
  hxmigrateService:
    repository: helix/hxmigrate-service
    tag: latest
    pullPolicy: IfNotPresent
  commerceService:                       # R5e step 7
    repository: helix/commerce-service
    tag: latest
    pullPolicy: IfNotPresent
  portalService:                         # R5e step 8
    repository: helix/portal-service
    tag: latest
    pullPolicy: IfNotPresent
  userService:                           # R5e step 10
    repository: helix/user-service
    tag: latest
    pullPolicy: IfNotPresent

# ── Services extracted from case-service (roadmap 13c-e) ─────────────
# They scale independently of the case lifecycle, which is what the split was
# for: a report sweep or a graph re-embed should not size the process that
# serves case transitions. Redis is enabled on each so the rate limit is one
# platform-wide budget rather than one per service.

analyticsService:
  replicaCount: 2
  port: 8202
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

hxgraphService:
  replicaCount: 1
  port: 8203
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

hxmigrateService:
  replicaCount: 1
  port: 8204
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

# R5e step 7: checkout, payments, storefront, marketplace, model market.
commerceService:
  replicaCount: 1
  port: 8207
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }
  # Storefront product media are written to the document store. An S3 store
  # set in `caseService.env` (`VELARIS_CASE_STORAGE_BACKEND`, `VELARIS_CASE_S3_*`)
  # must be set here too; without it media land in this pod's own filesystem
  # and are lost when it restarts.
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

# R5e step 9: worker-service — case-service's image in worker mode running the
# background jobs (scheduler, mail poll, sealers, sweeps, watchers). Off by
# default: case-service pods then run them as before, and the job leases keep
# two replicas from running one twice. On, case-service pods stop starting them.
# Safe at replicaCount > 1 (the leases). Gets caseService.env as well, so it
# sees the same storage, mail and Temporal settings; `env` here wins.
jobs:
  enabled: false
  replicaCount: 1
  port: 8208
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  env: {}

# R5e step 8: the customer portal and portal admin.
portalService:
  replicaCount: 1
  port: 8205
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 2Gi }
  # Portal uploads (case documents, the portal logo) are written to the document
  # store. An S3 store set in `caseService.env` (`VELARIS_CASE_STORAGE_BACKEND`,
  # `VELARIS_CASE_S3_*`) must be set here too; without it uploads land in this
  # pod's own filesystem and are lost when it restarts.
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

# R5e step 10: sign-in and identity (login, MFA, SSO, SAML, SCIM, the user
# directory). Redis on, so the sign-in rate limits are one set across replicas,
# not one per pod (the account lockout is in the database either way).
userService:
  replicaCount: 1
  port: 8206
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"

caseService:
  replicaCount: 2
  # ── Where uploaded documents go ───────────────────────────────────
  # The default store is a FILESYSTEM path inside the container
  # (`./data/velaris-docs`). In a cluster that means two things nobody is told
  # at upload time: a document is lost when its pod restarts, and with more than
  # one replica each pod holds a different set, so a download hits the wrong pod
  # and 404s.
  #
  # Two honest options: point the platform at an S3-compatible endpoint
  # (`VELARIS_CASE_STORAGE_BACKEND=s3` and `VELARIS_CASE_S3_*` in
  # `caseService.env` — the chart ships no object store of its own), or keep the
  # filesystem and give it a volume here. A ReadWriteOnce volume only works with
  # ONE replica; more than one needs ReadWriteMany.
  documents:
    mountPath: /app/data
    existingClaim: ""
    persistence:
      enabled: false
      size: 20Gi
      storageClass: ""
      accessModes: ["ReadWriteOnce"]
  port: 8200
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  env:
    VELARIS_CASE_REDIS_ENABLED: "true"
    VELARIS_CASE_RATE_LIMIT_BACKEND: "redis"
    VELARIS_CASE_DEBUG: "false"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

engine:
  replicaCount: 2
  port: 8100
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

worker:
  enabled: true
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 750m, memory: 768Mi }
  temporalHost: "temporal.default.svc.cluster.local:7233"
  # Mutual TLS to Temporal, for the worker and the engine. Name a Secret holding
  # ca.crt, tls.crt and tls.key (a kubernetes.io/tls Secret plus ca.crt fits).
  # Empty = plaintext, exactly as before. serverName: the name on Temporal's
  # certificate when it differs from temporalHost's host.
  temporalTls:
    secretName: ""
    serverName: ""
  taskQueue: "helix-case-service"
  keda:
    enabled: false    # Toggle on to use KEDA ScaledObject (needs KEDA CRDs installed)
    minReplicaCount: 1
    maxReplicaCount: 20
    queueDepthThreshold: 50

# ── Bundled database and cache images: PINNED BY DIGEST ─────────────
#
# Found 2026-08-26, fixed 2026-09-09. The chart pinned the *chart* version and
# left the *image* floating: three of the four subcharts default to
# `bitnami/<name>:latest`, so two clusters installing the same chart version a
# month apart run different database builds, and an existing cluster silently
# upgrades its database the next time a pod is rescheduled.
#
# The obvious fix — pin a version tag — is not available. Bitnami's 2025 policy
# leaves only `latest` in the free `bitnami/` namespace and moves every
# versioned tag to `bitnamilegacy/`. So the pin is a DIGEST: still the
# maintained image, no longer a moving one. Each digest below was resolved with
# `docker buildx imagetools inspect bitnami/<name>:latest` on 2026-09-09 and is
# the build the K8s verification ran against.
#
# To take a newer database: resolve the digest again, replace it here, and run
# the cluster verification. That is a deliberate act with a test behind it,
# which is exactly what `latest` took away.

postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: latest
    digest: "sha256:5614f19e4a5077217e53b3bd7e7f69d06af6a02919af4b90a9702e3648190c8c"
  auth:
    username: helix
    password: helix_dev_password
    database: helix

# Exactly one database may be enabled. PostgreSQL stays the default: an
# existing install upgrading to this chart version sees no change at all.
# Enabling either of these means also setting postgresql.enabled=false.
# MySQL is the sharp one. `docker.io/bitnami/mysql` is **EMPTY** — not "only
# latest", zero tags — so the version this chart pinned (9.4.0-debian-12-r1)
# cannot be pulled at all and `mysql.enabled=true` would ImagePullBackOff on a
# fresh cluster. The image itself still exists under `bitnamilegacy/`, which is
# where it is pointed, pinned by digest, so the path works today.
#
# `bitnamilegacy/` is FROZEN: it receives no updates and no security fixes. An
# operator running MySQL in production should point the chart at a database
# they operate (set `mysql.enabled=false` and give the platform its URL) rather
# than depend on an archived image. Said here rather than in a release note,
# because this file is where somebody enables it.
mysql:
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r1
    digest: "sha256:ec13e229247a737f7149b7f255d8f2d9c72da861f8bf263b22091bf131540da3"
  auth:
    username: helix
    password: helix_dev_password
    database: helix
    rootPassword: helix_dev_root

mariadb:
  enabled: false
  image:
    repository: bitnami/mariadb
    tag: latest
    digest: "sha256:16c4d59ca1e33e557e5003596d244aefac4dd03220c8967ae12e3cee2a4c7dd9"
  auth:
    username: helix
    password: helix_dev_password
    database: helix
    rootPassword: helix_dev_root

# ── Connection pooler (R5d 6a) ───────────────────────────────────────
# PgBouncer in front of the bundled PostgreSQL. OFF by default: an existing
# release upgrading to this chart sees no change. On, every workload connects
# through it, so 2 or 20 replicas share one small set of database connections
# (without it the PostgreSQL default of 100 is reached at about 3–4 copies).
# PostgreSQL only, and only with postgresql.enabled — an external database
# brings its own pooler (point VELARIS_CASE_DATABASE_POOLER_URL at it through
# each workload's `env`).
# R5d 11b — dashboards, reports, search and HxGraph read from a read replica
# (a managed one, CloudNativePG's `-ro` service, …). Empty = every read on the
# main database, exactly as before. A user's own changes, sign-in, case and task
# views and every write stay on the main. The URL carries a password, so it
# goes into the database Secret, never into a Deployment. The replica must be a
# copy of THIS database (checked at run time; anything else is skipped). An
# external replica also needs networkPolicy.extraEgressTo when policies are on.
readReplica:
  url: ""                    # e.g. postgresql+asyncpg://velaris:PASS@my-db-ro:5432/velaris
  # true = databaseSecret.existingSecret holds it under databaseSecret.readKey.
  fromExistingSecret: false

pooler:
  enabled: false
  image:
    repository: ghcr.io/cloudnative-pg/pgbouncer   # Apache-2.0
    tag: "1.25.2"                                  # >= 1.21 required (asyncpg)
  replicaCount: 2
  # The image's own uid/gid for `pgbouncer` (numeric, so runAsNonRoot can verify it).
  runAsUser: 998
  runAsGroup: 996
  poolSize: 20          # server connections per pool, per pooler replica
  maxClientConn: 1000
  commercePoolSize: 10  # commerce-service's own server connections, per pooler replica
  portalPoolSize: 10    # portal-service's own server connections, per pooler replica
  userPoolSize: 10      # user-service's own server connections, per pooler replica
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

valkey:
  enabled: true
  architecture: standalone
  image:
    repository: bitnami/valkey
    tag: latest
    digest: "sha256:b330d587970c5925265a12d367feba4b6cd89078c75ba118ffb70002834c1a7c"
  auth:
    enabled: false

# Seconds a pod keeps serving after it is told to stop, so in-flight requests
# finish while its endpoint is withdrawn. 0 restores the previous behaviour.
terminationDrainSeconds: 5

# PodDisruptionBudgets: how many pods must stay up during a drain or node
# upgrade. Disabled by default — enabling one on a single-replica deployment
# blocks node drains entirely.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ── NetworkPolicy ────────────────────────────────────────────────────
# OFF by default: policies in a cluster whose CNI ignores them buy nothing, and
# in one that enforces them they cut off whatever this chart did not think of.
# Enabled, each Velaris service accepts traffic only from this chart's own pods
# and (optionally) the ingress controller's namespace.
networkPolicy:
  enabled: false
  ingressControllerNamespace: ""     # e.g. ingress-nginx
  extraIngressFrom: []               # extra `from:` peers, verbatim
  extraEgressTo: []                  # extra `to:` peers (an external database, a SIEM)

ingress:
  enabled: false
  className: nginx
  # Annotations for the controller (e.g. force HTTPS, body size limits).
  annotations: {}
  # TLS is OFF until a certificate is supplied. Each entry is
  #   - hosts: [velaris.example.com]
  #     secretName: velaris-tls
  # The secret must already exist in the release namespace.
  tls: []
  hosts:
    - host: helix.local
      paths:
        # Longest prefix first: the extracted services own their paths, and
        # everything else falls through to case-service. These are the same
        # prefixes the nginx gateway routes in the host deployment — the
        # client-facing URLs are identical either way.
        - path: /api/v1/analytics
          pathType: Prefix
          service: analytics-service
        - path: /api/v1/process-mining
          pathType: Prefix
          service: analytics-service
        - path: /api/v1/graph
          pathType: Prefix
          service: hxgraph-service
        - path: /api/v1/hxmigrate
          pathType: Prefix
          service: hxmigrate-service
        - path: /api/v1/importer
          pathType: Prefix
          service: hxmigrate-service
        - path: /api/v1/scout
          pathType: Prefix
          service: hxmigrate-service
        - path: /api/v1/scout-ai
          pathType: Prefix
          service: hxmigrate-service
        - path: /api/v1/orchestrator
          pathType: Prefix
          service: hxmigrate-service
        # R5e step 7: the commerce domain.
        - path: /api/v1/checkout
          pathType: Prefix
          service: commerce-service
        - path: /api/v1/payments
          pathType: Prefix
          service: commerce-service
        - path: /api/v1/storefront
          pathType: Prefix
          service: commerce-service
        - path: /api/v1/marketplace
          pathType: Prefix
          service: commerce-service
        - path: /api/v1/model-market
          pathType: Prefix
          service: commerce-service
        # R5e step 8: the customer portal. `Prefix` matches whole path
        # elements, so /api/v1/portals (a case-service router) is not caught.
        - path: /api/v1/portal
          pathType: Prefix
          service: portal-service
        - path: /api/v1/portal-admin
          pathType: Prefix
          service: portal-service
        # R5e step 10: sign-in and identity. The longest matching path wins,
        # so /api/v1/auth/switch-context (access groups) stays case-service's;
        # /api/v1/identity/ also holds case-service's identity verification, so
        # only /provisioning goes to user-service.
        - path: /api/v1/auth
          pathType: Prefix
          service: user-service
        - path: /api/v1/auth/switch-context
          pathType: Exact
          service: case-service
        - path: /api/v1/scim
          pathType: Prefix
          service: user-service
        - path: /api/v1/identity/provisioning
          pathType: Prefix
          service: user-service
        - path: /api/v1/user-directory
          pathType: Prefix
          service: user-service
        - path: /
          pathType: Prefix
          service: case-service
        # case-service's /internal/v1 (R5e step 7) is NOT routed on purpose:
        # ingress paths cannot exclude a prefix from `/`, so the routes refuse
        # any call that arrives with proxy headers (X-Forwarded-For), whatever
        # it carries. Sibling services call case-service by its cluster address.

# Internal service API (R5e step 7 — the commerce split): commerce-service (and,
# since steps 8 and 10, portal-service and user-service) calls
# case-service's /internal/v1 routes with a shared secret. The chart generates
# one Secret (kept across upgrades); name your own here to bring it instead
# (key `internal-service-secret`).
internalService:
  existingSecret: ""

# The token signing secret (VELARIS_CASE_AUTH_SECRET), shared by every service.
# Empty = the chart generates one at install and keeps it across upgrades.
# `existingSecret` = a Secret you manage, holding it under `key`. Never change
# it on a running install: everyone is signed out and every encrypted field
# becomes unreadable (HxVault's key is derived from it).
authSecret:
  existingSecret: ""
  key: auth-secret

