{{/*
user-service — sign-in and identity, extracted from case-service at R5e step 10
(2026-10-22).

The ingress routes /api/v1/auth (except /api/v1/auth/switch-context, which stays
case-service's), /api/v1/scim, /api/v1/identity/provisioning and
/api/v1/user-directory here. Every service still checks tokens itself; this one
issues them. It asks case-service only to send the password-reset mail, over
case-service's internal API — by its cluster address, with the release's
internal secret.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.userServiceName" . }}
  labels: { app: user-service }
spec:
  replicas: {{ .Values.userService.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      # Nothing here talks to the Kubernetes API, so the default token has no
      # reader — and a mounted token is a credential an escaped process finds.
      automountServiceAccountToken: false
      securityContext:
        {{- include "helix.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ add (.Values.terminationDrainSeconds | default 5) 25 }}
      containers:
        - name: user-service
          image: "{{ .Values.image.userService.repository }}:{{ .Values.image.userService.tag }}"
          imagePullPolicy: {{ .Values.image.userService.pullPolicy }}
          # Stop accepting new work, then linger while the endpoint is
          # withdrawn from every node's kube-proxy. Without this a deleted pod
          # closes connections that are still in flight: measured at 29 of
          # 26,561 requests (0.11%) on a three-node cluster, and invisible on
          # one node because the replacement is local.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.terminationDrainSeconds | default 5 }}"]
          ports:
            - containerPort: {{ .Values.userService.port }}
          env:
            {{- include "helix.authSecretEnv" . | nindent 12 }}
            - name: VELARIS_CASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.dbSecretName" . }}
                  key: {{ include "helix.dbSecretKey" . }}
            - name: VELARIS_CASE_DATABASE_BACKEND
              value: {{ include "helix.databaseBackend" . | quote }}
            {{- include "helix.poolerEnv" . | nindent 12 }}
            {{- include "helix.readReplicaEnv" . | nindent 12 }}
            {{- include "helix.poolerUserEnv" . | nindent 12 }}
            - name: VELARIS_CASE_REDIS_URL
              value: {{ include "helix.redisUrl" . | quote }}
            # R5e step 10: case-service's internal API — its cluster address and
            # the release's internal secret (internal-secret.yaml).
            - name: VELARIS_CASE_SERVICE_INTERNAL_URL
              value: "http://{{ include "helix.caseServiceName" . }}:8200"
            - name: VELARIS_INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalService.existingSecret | default (printf "%s-internal" (include "helix.fullname" .)) }}
                  key: internal-service-secret
            - name: VELARIS_SERVICE_NAME
              value: user-service
            {{- range $k, $v := .Values.userService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          securityContext:
            {{- include "helix.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
          # Startup probe: the boot budget lives HERE, not in a liveness
          # `initialDelaySeconds` that has to guess. Liveness and readiness are
          # held off until this passes, so a slow first boot (migrations, a cold
          # model, a busy node) is waited out instead of being restarted in a
          # loop — and once it passes, liveness reacts at its own quick period.
          # 30 x 5s = up to 150s to come up; after that the pod is restarted.
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.userService.port }} }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.userService.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.userService.port }} }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.userServiceName" . }}
spec:
  selector: { app: user-service }
  ports:
    - port: 8200
      targetPort: {{ .Values.userService.port }}
      name: http
