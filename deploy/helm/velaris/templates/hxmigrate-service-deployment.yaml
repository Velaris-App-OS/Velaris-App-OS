{{/*
hxmigrate-service — extracted from case-service at roadmap 13e (2026-08-23).

The ingress routes /api/v1/hxmigrate, /importer, /scout, /scout-ai and /orchestrator here. Same image family, same database, its own
pool and its own replica count: that separation is the point of the split.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.hxmigrateServiceName" . }}
  labels: { app: hxmigrate-service }
spec:
  replicas: {{ .Values.hxmigrateService.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app: hxmigrate-service } }
  template:
    metadata: { labels: { app: hxmigrate-service } }
    spec:
      # Nothing here talks to the Kubernetes API, so the default token has no
      # reader — and a mounted token is a credential an escaped process finds.
      automountServiceAccountToken: false
      securityContext:
        {{- include "helix.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ add (.Values.terminationDrainSeconds | default 5) 25 }}
      containers:
        - name: hxmigrate-service
          image: "{{ .Values.image.hxmigrateService.repository }}:{{ .Values.image.hxmigrateService.tag }}"
          imagePullPolicy: {{ .Values.image.hxmigrateService.pullPolicy }}
          # Stop accepting new work, then linger while the endpoint is
          # withdrawn from every node's kube-proxy. Without this a deleted pod
          # closes connections that are still in flight: measured at 29 of
          # 26,561 requests (0.11%) on a three-node cluster, and invisible on
          # one node because the replacement is local.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.terminationDrainSeconds | default 5 }}"]
          ports:
            - containerPort: {{ .Values.hxmigrateService.port }}
          env:
            {{- include "helix.authSecretEnv" . | nindent 12 }}
            - name: VELARIS_CASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.dbSecretName" . }}
                  key: {{ include "helix.dbSecretKey" . }}
            - name: VELARIS_CASE_DATABASE_BACKEND
              value: {{ include "helix.databaseBackend" . | quote }}
            {{- include "helix.poolerEnv" . | nindent 12 }}
            - name: VELARIS_CASE_REDIS_URL
              value: {{ include "helix.redisUrl" . | quote }}
            {{- range $k, $v := .Values.hxmigrateService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          securityContext:
            {{- include "helix.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.hxmigrateService.resources | nindent 12 }}
          # Startup probe: the boot budget lives HERE, not in a liveness
          # `initialDelaySeconds` that has to guess. Liveness and readiness are
          # held off until this passes, so a slow first boot (migrations, a cold
          # model, a busy node) is waited out instead of being restarted in a
          # loop — and once it passes, liveness reacts at its own quick period.
          # 30 x 5s = up to 150s to come up; after that the pod is restarted.
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.hxmigrateService.port }} }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.hxmigrateService.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.hxmigrateService.port }} }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.hxmigrateServiceName" . }}
spec:
  selector: { app: hxmigrate-service }
  ports:
    - port: 8200
      targetPort: {{ .Values.hxmigrateService.port }}
      name: http
