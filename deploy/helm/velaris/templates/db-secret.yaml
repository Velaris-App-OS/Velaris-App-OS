{{- if not .Values.databaseSecret.existingSecret }}
# The database URL, out of every Deployment's env block.
#
# Kept in a Secret because it carries the password: rendered inline it is
# readable by anyone who can `get deployments`, which on most clusters is a much
# wider group than `get secrets`. Set `databaseSecret.existingSecret` to bring
# your own (an external secret manager, a sealed secret) and this renders nothing.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helix.fullname" . }}-db
  labels: { app: {{ include "helix.name" . }} }
type: Opaque
stringData:
  {{ include "helix.dbSecretKey" . }}: {{ include "helix.databaseUrl" . | quote }}
  {{- if (.Values.readReplica | default dict).url }}
  # R5d 11b: the read replica. Only rendered when readReplica.url is set.
  {{ .Values.databaseSecret.readKey | default "read-url" }}: {{ .Values.readReplica.url | quote }}
  {{- end }}
  {{- if include "helix.poolerOn" . }}
  # R5d 6a: the URL through the pooler, and the password the pooler itself
  # logs in to PostgreSQL with. Only rendered when pooler.enabled.
  {{ include "helix.poolerSecretKey" . }}: {{ include "helix.poolerUrl" . | quote }}
  {{ include "helix.poolerCommerceSecretKey" . }}: {{ include "helix.poolerCommerceUrl" . | quote }}
  {{ include "helix.poolerPortalSecretKey" . }}: {{ include "helix.poolerPortalUrl" . | quote }}
  {{ include "helix.poolerUserSecretKey" . }}: {{ include "helix.poolerUserUrl" . | quote }}
  {{ .Values.databaseSecret.poolerPasswordKey | default "pooler-db-password" }}: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}
