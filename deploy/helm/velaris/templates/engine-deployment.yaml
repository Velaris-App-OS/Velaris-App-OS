apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix.engineName" . }}
  labels: { app: engine }
spec:
  replicas: {{ .Values.engine.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app: engine } }
  template:
    metadata: { labels: { app: engine } }
    spec:
      # Nothing here talks to the Kubernetes API, so the default token has no
      # reader — and a mounted token is a credential an escaped process finds.
      automountServiceAccountToken: false
      securityContext:
        {{- include "helix.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ add (.Values.terminationDrainSeconds | default 5) 25 }}
      {{- if include "helix.temporalTlsOn" . }}
      {{- include "helix.temporalTlsVolume" . | nindent 6 }}
      {{- end }}
      containers:
        - name: engine
          image: "{{ .Values.image.engine.repository }}:{{ .Values.image.engine.tag }}"
          imagePullPolicy: {{ .Values.image.engine.pullPolicy }}
          # Stop accepting new work, then linger while the endpoint is
          # withdrawn from every node's kube-proxy. Without this a deleted pod
          # closes connections that are still in flight: measured at 29 of
          # 26,561 requests (0.11%) on a three-node cluster, and invisible on
          # one node because the replacement is local.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.terminationDrainSeconds | default 5 }}"]
          ports:
            - containerPort: {{ .Values.engine.port }}
          env:
            # The engine reads plain DATABASE_URL (helix_engine/db/session.py) and
            # defaults to localhost:5432 — which in a pod is the pod itself. It
            # does not fail on that: it logs "database unavailable", falls back
            # to an IN-MEMORY store and reports itself ready, so every engine pod
            # runs with no persistence and nothing says so. Nothing anywhere reads
            # VELARIS_ENGINE_DATABASE_URL; it is kept because an install may
            # already carry it, and removing a variable an install holds is not
            # something an update gets to do.
            # With the pooler on (R5d 6a) DATABASE_URL is the pooled URL: the
            # engine prefers DATABASE_URL over VELARIS_CASE_DATABASE_POOLER_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.dbSecretName" . }}
                  key: {{ if include "helix.poolerOn" . }}{{ include "helix.poolerSecretKey" . }}{{ else }}{{ include "helix.dbSecretKey" . }}{{ end }}
            - name: VELARIS_ENGINE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "helix.dbSecretName" . }}
                  key: {{ include "helix.dbSecretKey" . }}
            # Which engine that URL speaks, for the portable-SQL layer. Every
            # other workload gets this; the engine was left out.
            - name: VELARIS_CASE_DATABASE_BACKEND
              value: {{ include "helix.databaseBackend" . | quote }}
            # The engine reads plain TEMPORAL_HOST (helix_engine/temporal/client.py),
            # not the worker's setting, and defaults to localhost:7233 — which in a pod
            # is the pod itself. Without this it reports temporal "unavailable" forever
            # while a perfectly healthy Temporal runs next door.
            - name: TEMPORAL_HOST
              value: {{ .Values.worker.temporalHost | quote }}
            {{- if include "helix.temporalTlsOn" . }}
            {{- include "helix.temporalTlsEnv" . | nindent 12 }}
            {{- end }}
          {{- if include "helix.temporalTlsOn" . }}
          {{- include "helix.temporalTlsMount" . | nindent 10 }}
          {{- end }}
          securityContext:
            {{- include "helix.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          # Startup probe: the boot budget lives HERE, not in a liveness
          # `initialDelaySeconds` that has to guess. Liveness and readiness are
          # held off until this passes, so a slow first boot (migrations, a cold
          # model, a busy node) is waited out instead of being restarted in a
          # loop — and once it passes, liveness reacts at its own quick period.
          # 30 x 5s = up to 150s to come up; after that the pod is restarted.
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.engine.port }} }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            # /ready checks the DATABASE; /health only says the process is up.
            # The engine falls back to an in-memory store when the database is
            # unreachable — deployed processes then live in one pod's memory and
            # vanish on restart — and it probed /health, so such a pod reported
            # Ready and took traffic. Same fix as case-service in the August
            # Kubernetes pass; the engine kept the old shape until 2026-09-17.
            httpGet: { path: /ready, port: {{ .Values.engine.port }} }
            periodSeconds: 10
          livenessProbe:
            # Liveness stays on /health: restarting every engine pod because the
            # database blipped would turn a database outage into a platform one.
            httpGet: { path: /health, port: {{ .Values.engine.port }} }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.engineName" . }}
spec:
  selector: { app: engine }
  ports:
    - port: 8100
      targetPort: {{ .Values.engine.port }}
      name: http
