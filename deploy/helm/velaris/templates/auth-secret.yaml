{{- if not .Values.authSecret.existingSecret }}
# The token signing secret (2026-10-30).
#
# Until this existed the chart set none, so every pod signed and checked sign-in
# tokens with the default string in the source — anyone could mint an admin
# token for any Kubernetes install — and HxVault's key derives from it too.
# Generated ONCE, like the internal secret: an upgrade reads it back (`lookup`)
# and never mints a new one, because a new value signs everyone out and makes
# every encrypted field unreadable. `keep` survives `helm uninstall` for the
# same reason. Bring your own with `authSecret.existingSecret`.
{{- $name := printf "%s-auth" (include "helix.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: { app: {{ include "helix.name" . }} }
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data .Values.authSecret.key) }}
  {{ .Values.authSecret.key }}: {{ index $existing.data .Values.authSecret.key }}
  {{- else }}
  {{ .Values.authSecret.key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
