{{- if not .Values.internalService.existingSecret }}
# The internal service secret (R5e step 7 — the commerce split).
#
# commerce-service calls case-service's /internal/v1 routes with it; they refuse
# any call without it. Generated ONCE: an upgrade reads the existing Secret back
# (`lookup`) instead of minting a new value, so the two services never disagree.
# `helm template` (no cluster) renders a fresh value each time — fine for a dry
# run, never applied. Bring your own with `internalService.existingSecret`.
{{- $name := printf "%s-internal" (include "helix.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: { app: {{ include "helix.name" . }} }
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "internal-service-secret") }}
  internal-service-secret: {{ index $existing.data "internal-service-secret" }}
  {{- else }}
  internal-service-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
