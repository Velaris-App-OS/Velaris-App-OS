[project]
name = "velaris-case-service"
version = "0.1.0"
description = "Velaris Case Management Service"
requires-python = ">=3.12"
license = "LicenseRef-BSL-1.1"
dependencies = [
    # The shared layer carved out at 13b: config, db, auth, hxguard.
    "velaris-shared",
    # HxArbiter's deterministic evaluator. Imported at MODULE scope by
    # agents/attribution.py, so this is a hard dependency, not an extra: the
    # service does not start without it.
    "hxarbiter-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    # The database query connector (2026-11-08) reads a tenant's MySQL /
    # MariaDB whatever this install's own database is, so the MySQL driver is
    # core now. Pure Python. The [mysql] extra below stays as it was.
    "aiomysql>=0.2.0",
    # [email] — auth_real.py uses `EmailStr` at MODULE scope, and pydantic
    # raises at class-definition time when email-validator is absent. It was
    # only ever present by accident, and `uv sync` being exact would have
    # pruned it (2026-09-17, same shape as hxarbiter-core below).
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "temporalio>=1.7.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "minio>=7.2",
    "pypdf>=4.3",
    "pypdfium2>=4.0",
    "Pillow>=10.4",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "pyotp>=2.9.0",           # MFA — imported at module scope by auth_real
    "aiofiles>=23.2",
    "redis>=5.0",
    "locust>=2.31",
    "aiosmtplib>=3.0",
    "aioimaplib>=1.0",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "pycryptodome>=3.20",
    "numpy>=2.4.4",
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    "bcrypt>=4.9.9",
    "docker>=7.0.0",
    "faker>=25.0.0",
    "semver>=3.0.0",
    "webauthn>=2.0.0",
    "wasmtime>=45,<46",
    # SAML 2.0 SP (enterprise identity P1) — XML-DSig verification. Core, not an
    # optional extra: it is pure Python over lxml and cryptography, both already
    # here, so it adds no wheel of consequence. The design's optional-extra plan
    # was written around pysaml2, which shells out to the `xmlsec1` BINARY — that
    # would have put an apt package in the install path and a
    # "configured but unusable" state in the code. This has neither.
    "signxml>=4.0",
]

[project.optional-dependencies]
dev = [
    # The extracted services, for tests only. `tests/phase_authz/
    # test_ungated_routes.py` sweeps the PLATFORM's route table, which after
    # 13c-e means all four apps — a sweep of one would silently stop watching
    # the 80 routes that left.
    "velaris-analytics-service",
    "velaris-hxgraph-service",
    "velaris-hxmigrate-service",
    "velaris-commerce-service",   # R5e step 7: the guards sweep its routes too
    "velaris-portal-service",     # R5e step 8: and the portal's; its routes in mixed suites
    "velaris-user-service",       # R5e step 10: sign-in; every suite signs in through it
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]
# Durable event log (§2.1) — the outbox fan-out onto Kafka. Optional
# because the bus is OFF by default: the outbox is already durable on disk, so
# this adds distribution, not safety. `event_bus.py` imports it lazily, so a
# deployment without the wheel simply never starts the relay.
events = [
    "aiokafka>=0.10.0",
]
# DB SDK — per-backend drivers, installed only for the chosen backend (BYO model).
# PostgreSQL (asyncpg) is a core dependency since it is the default backend.
mysql = [
    "aiomysql>=0.2.0",   # async driver for the running service
    "pymysql>=1.1.0",    # sync driver for migrations / admin scripts
]
# HxMeet P4a — local session transcription. Optional: the endpoint fail-closes
# with 501 when it's absent, so a base install stays lean (no ML weights).
intelligence = [
    "faster-whisper>=1.0.0",
    # P4a-live streaming captions — the portable engine (build with
    # GGML_VULKAN=1 for AMD/Intel GPU; the CPU wheel still works, lag mode).
    "pywhispercpp>=1.5.0",
]
# HxMeet P4c — Video-KYC passive signal pass on the sealed recording. Optional
# for the same reason: checks whose dependency is absent are skipped honestly
# (never silently), and the endpoint 501s only when NO check could run.
kyc = [
    "av>=12.0.0",     # in-memory MP4 frame decode (no temp files)
    "numpy>=1.26",    # moiré spectral analysis + micro-movement statistics
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["case_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.3.0",
]
