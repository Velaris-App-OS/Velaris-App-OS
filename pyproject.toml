[project]
name = "velaris"
version = "0.1.0"
description = "Enterprise Case Management and Process Automation Platform"
requires-python = ">=3.12"
license = "LicenseRef-BSL-1.1"
dependencies = [
    "bcrypt>=5.0.0",
    "pyotp>=2.9.0",
    # Backup encryption (scripts/backup/velaris_backup.py): the age format,
    # in-process, so no system package is needed — an unattended update cannot
    # apt-install. Sets stay decryptable with the standard `age` tool. MIT.
    "pyrage>=1.4,<2",
]

[tool.uv.workspace]
members = [
    "libs/velaris-ir/python",
    "libs/velaris-sdk",
    # HxArbiter's evaluator. It was outside the workspace, so
    # `uv sync --all-packages` never installed it and — sync being exact —
    # PRUNED a hand-installed copy. case-service imports it at module scope
    # (agents/attribution.py, reached from api/routers/hxnexus.py), so a host
    # that ran an update died on `ModuleNotFoundError: hxarbiter_core` before
    # serving a request. Found on the DuckDNS box, 2026-09-17.
    "libs/hxarbiter-core",
    "engine",
    "services/*",
    "codegen",
    "scout/cli",
    "scout/agent",
    "migration",
    "plugins/*/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.uv.sources]
velaris-ir = { workspace = true }
hxarbiter-core = { workspace = true }
velaris-shared = { workspace = true }
velaris-case-service = { workspace = true }
velaris-analytics-service = { workspace = true }
velaris-hxgraph-service = { workspace = true }
velaris-hxmigrate-service = { workspace = true }
velaris-commerce-service = { workspace = true }
velaris-portal-service = { workspace = true }
velaris-user-service = { workspace = true }
velaris-sdk = { workspace = true }
velaris-engine = { workspace = true }
